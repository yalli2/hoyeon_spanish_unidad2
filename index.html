<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>Unidad 2 · La plaza mayor — 스페인어 중간고사 학습</title>
<style>
:root{--bg:#fafaf7;--card:#fff;--ink:#1f2328;--mut:#667085;--line:#e4e4de;--pri:#d9480f;--pri2:#fff1e8;--ok:#2b8a3e;--okbg:#e6f4ea;--bad:#c92a2a;--badbg:#fdeaea;--blue:#1c7ed6;--bluebg:#e7f1fb;--yel:#b57900;--yelbg:#fff6dd}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",Segoe UI,sans-serif;line-height:1.6;font-size:16px}
header{background:linear-gradient(135deg,#e8590c,#f59f00);color:#fff;padding:18px 16px 12px}
header h1{margin:0;font-size:1.25rem}header p{margin:2px 0 0;opacity:.92;font-size:.9rem}
nav{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;overflow-x:auto;gap:2px;padding:4px 8px;scrollbar-width:none}
nav a{flex:0 0 auto;text-decoration:none;color:var(--mut);padding:8px 12px;border-radius:999px;font-size:.9rem;white-space:nowrap}
nav a.on{background:var(--pri2);color:var(--pri);font-weight:700}
main{max-width:860px;margin:0 auto;padding:14px 14px 60px}
h2{font-size:1.3rem;margin:.4em 0 .5em}h3{font-size:1.1rem;margin:1.1em 0 .4em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tile{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit}
.tile:hover{border-color:var(--pri)}.tile b{display:block}.tile small{color:var(--mut)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:var(--pri2);color:var(--pri)}.btn.sm{padding:5px 10px;font-size:.85rem}.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--mut);border:1px solid var(--line)}
.spk{border:0;background:var(--bluebg);border-radius:999px;cursor:pointer;padding:1px 7px;font-size:.85rem}
.chip{display:inline-block;background:var(--pri2);color:var(--pri);border-radius:999px;padding:2px 10px;margin:2px;font-size:.9rem}
.tbl{width:100%;border-collapse:collapse;font-size:.93rem;margin:8px 0}.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}.tbl th{background:var(--pri2);color:var(--pri)}
.wrapx{overflow-x:auto}
.ex{background:var(--bluebg);border-radius:10px;padding:6px 10px;margin:6px 0}.ex span{color:var(--mut);font-size:.9rem;display:block}
.note,.tip,.warn{border-radius:10px;padding:8px 12px;margin:10px 0;font-size:.95rem}
.tip{background:var(--okbg)}.note{background:var(--bluebg)}.warn{background:var(--yelbg)}
.bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qhead{display:flex;gap:10px;align-items:center;font-size:.9rem;color:var(--mut)}
.qtext{font-size:1.1rem;margin:12px 0}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--pri)}.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
input[type=text],textarea,select{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--ink)}
textarea{min-height:170px}
.fb{border-radius:10px;padding:10px 12px;margin:10px 0}.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}.fb.acc{background:var(--yelbg)}
.passage{background:var(--yelbg);border-radius:10px;padding:10px 14px;margin:10px 0;white-space:normal}
.secbanner{background:var(--pri);color:#fff;border-radius:8px;padding:4px 12px;display:inline-block;font-weight:700;margin:8px 0}
.tok{display:inline-block;background:var(--pri2);color:var(--pri);border:1px solid var(--pri);border-radius:8px;padding:4px 10px;margin:3px;cursor:pointer;font:inherit}
.built{min-height:48px;border:2px dashed var(--line);border-radius:10px;padding:6px;margin:8px 0}
.flash{min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;font-size:1.6rem;font-weight:700;user-select:none}
.flash small{font-size:1rem;font-weight:400;color:var(--mut)}
.map{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;text-align:center}
.mrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.mrow span{background:var(--pri2);border-radius:8px;padding:8px 2px;font-size:.85rem}
.mst{background:#868e96;color:#fff;border-radius:6px;padding:4px;margin:6px 0;font-size:.8rem}
.hideko .ko{filter:blur(6px);cursor:pointer}.hideko .ko.show{filter:none}
.bars div{margin:6px 0}.bars .b{height:18px;background:var(--pri);border-radius:5px;color:#fff;font-size:.8rem;padding-left:6px}
ul.chk{list-style:none;padding:0}ul.chk li{padding:2px 0}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:20px}
.pill{font-size:.75rem;background:var(--okbg);color:var(--ok);border-radius:99px;padding:1px 8px;margin-left:6px}
</style>

<body>
<header><h1>🏙️ Unidad 2 · La plaza mayor</h1><p>Spanish 2 중간고사 대비 · 혼자서 끝내는 인터랙티브 학습 (Entre culturas 2)</p></header>
<nav id="nav"></nav>
<main id="app"></main>
<footer>Profesora: M. Fernanda Osorno · Entre culturas 2 (Versión 2026) · 학습 보조용 자료입니다. 진도는 이 브라우저에 저장됩니다.</footer>

<script>
/* ================= 기본 도구 ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let S={scores:{},known:{},wrong:[],goals:{},practiced:{},draft:''};
try{const r=localStorage.getItem('u2plaza');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('u2plaza',JSON.stringify(S))}catch(e){}};
const app=$('#app');

/* ================= 음성(TTS) ================= */
const TTS='speechSynthesis' in window;
let dlgTok=0;
function pickVoice(){const v=speechSynthesis.getVoices().filter(x=>/^es/i.test(x.lang));for(const p of ['es-AR','es-MX','es-US','es-ES']){const f=v.find(x=>x.lang.replace('_','-')===p);if(f)return f}return v[0]||null}
function say(t,rate=0.9,pitch=1,cb,keep){
  if(!TTS){alert('이 브라우저는 음성 재생을 지원하지 않아요. Chrome/Safari를 사용해 보세요.');return}
  if(!keep)dlgTok++;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t.replace(/[¿¡]/g,''));const v=pickVoice();
  u.lang=v?v.lang:'es-ES';if(v)u.voice=v;u.rate=rate;u.pitch=pitch;if(cb)u.onend=cb;
  speechSynthesis.speak(u);
}
function stopAudio(){dlgTok++;if(TTS)speechSynthesis.cancel()}
function playDialog(key,rate){
  const d=DLG[key];const my=++dlgTok;let i=0;
  (function nx(){if(my!==dlgTok||i>=d.lines.length)return;const l=d.lines[i++];say(l[1],rate,l[0]==='B'?1.2:0.95,nx,true)})();
}
if(TTS)speechSynthesis.onvoiceschanged=()=>{};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-say]');if(b){e.stopPropagation();say(b.dataset.say)}
  const k=e.target.closest('.hideko .ko');if(k)k.classList.toggle('show');
});
const spk=t=>`<button class="spk" data-say="${esc(t)}" title="듣기">🔊</button>`;
const E=(es,ko)=>`<div class="ex">${spk(es)} <b>${es}</b>${ko?`<span>${ko}</span>`:''}</div>`;

/* ================= 문제 생성기 ================= */
const mc=(q,a,w,exp='',x={})=>({type:'mc',q,answer:a,options:[a,...w],exp,...x});
const fl=(q,a,exp='',x={})=>({type:'fill',q,answer:Array.isArray(a)?a:[a],exp,...x});
const od=(q,a,exp='',x={})=>({type:'order',q,answer:a,exp,...x});
const strip=s=>s.toLowerCase().replace(/[¿?¡!.,;:"“”]/g,'').replace(/\s+/g,' ').trim();
const noacc=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function chk(user,answers){const u=strip(user);if(!u)return 'no';for(const a of answers)if(u===strip(a))return 'ok';for(const a of answers)if(noacc(u)===noacc(strip(a)))return 'acc';return 'no'}

/* ================= 어휘 데이터 ================= */
const V=[
{id:'places',t:'City Places & Public Spaces',ko:'도시 장소·공공장소',ic:'🏙️',w:[
['la plaza','광장','plaza / square'],['el parque','공원','park'],['la calle','거리, 길','street'],['la avenida','대로','avenue'],['la esquina','모퉁이','corner'],['la cuadra','(한) 블록','block'],['el barrio','동네','neighborhood'],['el centro','시내, 중심가','downtown'],['el museo','박물관','museum'],['el estadio','경기장','stadium'],['el cine','영화관','movie theater'],['el gimnasio','체육관, 헬스장','gym'],['la escuela / el colegio','학교','school',['la escuela','el colegio']],['la biblioteca','도서관','library'],['el centro comercial','쇼핑몰','shopping mall']]},
{id:'shops',t:'Shops & Services',ko:'가게·서비스',ic:'🏪',w:[
['la farmacia','약국','pharmacy'],['el banco','은행','bank'],['el cajero automático','ATM(현금인출기)','ATM'],['el hospital','병원','hospital'],['la panadería','빵집','bakery'],['el supermercado','슈퍼마켓','supermarket'],['la tienda','가게','store'],['la tienda de ropa','옷 가게','clothing store'],['la tienda de zapatos','신발 가게','shoe store'],['la cafetería','카페','cafe'],['el restaurante','식당','restaurant'],['el kiosco','키오스크(길가 작은 매점)','kiosk'],['la heladería','아이스크림 가게','ice cream shop'],['la feria','장터, 시장(임시 장)','fair / market'],['el mercado','시장','market'],['la oficina de correos','우체국','post office']]},
{id:'transport',t:'Transportation',ko:'교통',ic:'🚇',w:[
['la estación de subte / metro','지하철역','subway station',['la estación de subte','la estación de metro']],['la parada de bus','버스 정류장','bus stop'],['el autobús','버스','bus'],['el transporte público','대중교통','public transportation']]},
{id:'products',t:'Products & Shopping',ko:'물건·쇼핑',ic:'🛍️',w:[
['la ropa','옷','clothes'],['los zapatos','신발','shoes'],['el pan','빵','bread'],['la carne','고기','meat'],['el helado','아이스크림','ice cream'],['las frutas','과일','fruits'],['las verduras','채소','vegetables'],['la comida','음식','food'],['los libros','책','books'],['los regalos','선물','gifts'],['el dinero en efectivo','현금','cash'],['la tarjeta de crédito','신용카드','credit card']]},
{id:'habits',t:'Shopping Habits & Technology',ko:'쇼핑 습관·기술',ic:'💻',w:[
['comprar en línea','온라인으로 구매하다','to shop online'],['comprar en una tienda','가게에서 구매하다','to shop in a store'],['las compras','쇼핑, 장보기','shopping'],['los productos','제품','products'],['la computadora','컴퓨터','computer'],['el teléfono','전화기, 휴대폰','phone'],['los dispositivos electrónicos','전자 기기','electronic devices'],['comprar','사다','to buy'],['vender','팔다','to sell'],['pagar','지불하다','to pay'],['preferir','선호하다','to prefer']]},
{id:'actions',t:'Actions & Directions',ko:'행동·길 안내 동사',ic:'🧭',w:[
['caminar','걷다','to walk'],['doblar','(방향을) 돌다','to turn'],['girar','돌다, 회전하다','to turn'],['seguir','계속 가다, 따라가다','to follow / continue'],['cruzar','건너다','to cross'],['pasar','지나가다','to pass'],['llegar','도착하다','to arrive'],['visitar','방문하다','to visit'],['comer','먹다','to eat'],['pasear','산책하다','to stroll'],['salir','나가다, 출발하다','to go out / leave'],['sacar dinero','돈을 뽑다(인출하다)','to withdraw money'],['tomar un café','커피를 마시다','to have a coffee'],['ver un espectáculo','공연을 보다','to see a show']]},
{id:'culture',t:'Culture & Community',ko:'문화·지역사회',ic:'🌎',w:[
['Argentina','아르헨티나','Argentina'],['Buenos Aires','부에노스아이레스','Buenos Aires'],['La Boca','라 보카(부에노스아이레스의 알록달록한 동네)','La Boca'],['el tango','탱고','tango'],['el mate','마테(전통 차)','mate'],['el asado','아사도(아르헨티나식 바비큐)','Argentine barbecue'],['las empanadas','엠파나다(속을 채운 페이스트리)','empanadas'],['la feria artesanal','수공예 장터','artisan fair'],['las artesanías','수공예품','handicrafts'],['los espacios públicos','공공 공간','public spaces']]}
];
const ALLW=V.flatMap(c=>c.w);
const art=/^(el|la|los|las|un|una)\s+/;
function accepted(w){const out=new Set();(w[3]||[w[0]]).forEach(b=>{out.add(b);out.add(b.replace(art,''))});return [...out]}
function vocabQs(words,n){
  const picks=shuffle(words).slice(0,n);
  return picks.map((w,i)=>{
    const oth=shuffle(words.filter(x=>x!==w));const kind=i%4;
    if(kind===0)return mc(`${spk(w[0])} <b>${w[0]}</b> 의 뜻은?`,w[1],oth.slice(0,3).map(x=>x[1]),`${w[0]} = ${w[1]} (${w[2]})`,{cat:'Vocabulary',sec:'TEST II'});
    if(kind===1)return mc(`"<b>${w[1]}</b>" 을(를) 스페인어로?`,w[0],oth.slice(0,3).map(x=>x[0]),`${w[1]} = ${w[0]}`,{cat:'Vocabulary',sec:'TEST II'});
    if(kind===2)return fl(`"<b>${w[1]}</b>" (${w[2]}) → 스페인어로 쓰세요 (관사는 써도, 안 써도 돼요)`,accepted(w),`정답: ${w[0]}`,{cat:'Vocabulary',sec:'TEST II'});
    return TTS?mc(`🔊 듣고 뜻을 고르세요`,w[1],oth.slice(0,3).map(x=>x[1]),`${w[0]} = ${w[1]}`,{audio:w[0],cat:'Vocabulary',sec:'TEST II'})
              :mc(`${spk(w[0])} <b>${w[0]}</b> = ?`,w[2],oth.slice(0,3).map(x=>x[2]),`${w[0]} = ${w[2]}`,{cat:'Vocabulary',sec:'TEST II'});
  });
}

/* ================= 문법 데이터 ================= */
const MAP=`<div class="map"><div class="mrow"><span>🏦<br>el banco</span><span>💊<br>la farmacia</span><span>📚<br>la biblioteca</span><span>☕<br>la cafetería</span></div><div class="mst">Calle Principal ➡ Caminas hacia el ESTE (북쪽 ↑ 위 / 남쪽 ↓ 아래)</div><div class="mrow"><span>🥖<br>la panadería</span><span>🌳<br>el parque</span><span>🎬<br>el cine</span><span>🏫<br>la escuela</span></div><small>동쪽(오른쪽 화면)으로 걸어가면 위쪽 건물은 <b>왼쪽(izquierda)</b>, 아래쪽 건물은 <b>오른쪽(derecha)</b>이에요.</small></div>`;
const GC='Grammar';
const G=[
{id:'hay',t:'Hay vs. Estar',ko:'있다: hay와 estar',ic:'📍',lesson:`
<p><b>hay</b> = ~이 있다 (there is / there are). <u>모양이 변하지 않아요</u> (단수·복수 모두 hay).<br><b>estar</b> = ~에 있다 (위치). 주어에 따라 <b>está / están</b>.</p>
<div class="wrapx"><table class="tbl"><tr><th></th><th>hay</th><th>estar</th></tr>
<tr><td>쓰임</td><td>존재 여부 (불특정·처음 소개)</td><td>이미 아는 특정 대상의 위치</td></tr>
<tr><td>함께 쓰는 말</td><td>un, una, unos, unas, 숫자, muchos, varios, 관사 없음</td><td>el, la, los, las, mi, su, 고유명사</td></tr>
<tr><td>부정</td><td>no hay</td><td>no está / no están</td></tr>
<tr><td>질문</td><td>¿Hay un banco aquí?</td><td>¿Dónde está el banco?</td></tr></table></div>
${E('Hay un parque en mi barrio.','우리 동네에는 공원이 하나 있어요.')}${E('El parque está cerca de la escuela.','그 공원은 학교 근처에 있어요.')}${E('Hay dos cines en el centro.','시내에 영화관이 두 개 있어요.')}${E('Los cines están en el centro.','그 영화관들은 시내에 있어요.')}
<div class="tip">💡 <b>요령</b>: un / una / 숫자 → <b>hay</b> &nbsp;|&nbsp; el / la / mi / 이름 → <b>está(n)</b></div>`,
qs:[
mc('___ un parque en mi barrio.','Hay',['Está','Están','Es'],'un parque(불특정) → hay',{cat:GC}),
mc('El parque ___ cerca de la escuela.','está',['hay','están','es'],'el parque(특정) → está',{cat:GC}),
mc('En el centro ___ muchas tiendas.','hay',['está','están','son'],'muchas tiendas(불특정) → hay (복수여도 hay)',{cat:GC}),
mc('Los museos ___ en el centro.','están',['hay','está','es'],'los museos(특정, 복수) → están',{cat:GC}),
mc('¿Dónde ___ la farmacia?','está',['hay','están','es'],'¿Dónde está + 특정 장소?',{cat:GC}),
mc('¿___ un banco cerca de aquí?','Hay',['Está','Están','Son'],'있는지 묻기 → ¿Hay ...?',{cat:GC}),
fl('La biblioteca ___ al lado del cine.','está','특정 장소의 위치 → está',{cat:GC}),
fl('En mi barrio no ___ un estadio.','hay','no hay = 없다',{cat:GC}),
mc('Mi escuela ___ lejos de mi casa.','está',['hay','están','son'],'mi escuela(특정) → está',{cat:GC}),
mc('Buenos Aires ___ en Argentina.','está',['hay','están','son'],'고유명사 → está',{cat:GC}),
fl('___ dos cines y un teatro en la avenida.','Hay','숫자/un → hay',{cat:GC}),
mc('Las empanadas ___ en la mesa.','están',['hay','está','es'],'las empanadas(특정, 복수) → están',{cat:GC})]},

{id:'prep',t:'Prepositions of Location',ko:'위치 전치사',ic:'🗺️',lesson:`
<div class="wrapx"><table class="tbl"><tr><th>스페인어</th><th>뜻</th></tr>

function wkey(q){return q.q+'|'+JSON.stringify(q.answer)}
function addWrong(q){const k=wkey(q);if(S.wrong.some(w=>wkey(w)===k))return;const{type,answer,options,exp,ctx,audio,dlg,sec,cat,extra}=q;S.wrong.push({type,q:q.q,answer,options,exp,ctx,audio,dlg,sec,cat,extra});if(S.wrong.length>200)S.wrong.shift();save()}
function delWrong(q){const k=wkey(q);S.wrong=S.wrong.filter(w=>wkey(w)!==k);save()}
function quiz(el,qs0,o={}){
  let qs=o.noshuffle?qs0.slice():shuffle(qs0),i=0,score=0,miss=[],secs={},lastSec=null,t0=Date.now();

    let picked=[],bank=q.type==='order'?shuffle(q.answer.split(' ').concat(q.extra||[])).map((t,n)=>({t,n,used:false})):null;
    const banner=(q.sec&&q.sec!==lastSec)?`<div class="secbanner">${q.sec}</div>`:'';lastSec=q.sec||lastSec;
    el.innerHTML=`<div class="card"><div class="qhead"><span>${i+1} / ${total}</span><div class="bar"><i style="width:${i/total*100}%"></i></div><span>✔ ${score}</span></div>${banner}
    ${q.ctx?`<div class="passage">${q.ctx}</div>`:''}
    <div class="qtext">${q.q} ${q.audio?spk(q.audio):''} ${q.dlg?`<button class="btn sm sec" id="pd">▶ 대화 듣기</button> <button class="btn sm ghost" id="ps">■</button>`:''}</div>
    <div id="ans"></div><div id="fb"></div></div>`;
    if(q.dlg){$('#pd',el).onclick=()=>playDialog(q.dlg,.85);$('#ps',el).onclick=stopAudio}
    const ans=$('#ans',el);let done_=false;
    function fin(res,user){
      if(done_)return;done_=true;
      const ok=res==='ok'||res==='acc';
      if(ok)score++;else{miss.push(q);addWrong(q)}
      if(ok&&o.review)delWrong(q);
      const sc=q.sec||q.cat||'';if(sc){secs[sc]=secs[sc]||[0,0];secs[sc][1]++;if(ok)secs[sc][0]++}
      const ca=Array.isArray(q.answer)?q.answer[0]:q.answer;
      $('#fb',el).innerHTML=`<div class="fb ${res==='no'?'bad':res==='acc'?'acc':'ok'}">${res==='ok'?'✅ 정답!':res==='acc'?'🟡 거의 맞았어요! 악센트(á é í ó ú ñ)를 확인하세요 → <b>'+esc(ca)+'</b>':'❌ 정답: <b>'+esc(ca)+'</b>'}${q.exp?`<br><small>${q.exp}</small>`:''}</div><button class="btn" id="nx">${i+1>=total?'결과 보기':'다음 ▶'}</button>`;
      const nx=$('#nx',el);nx.focus();nx.onclick=()=>{i++;show()};
    }
    if(q.type==='mc'){
      opts.forEach(t=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>{ans.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.textContent===q.answer)x.classList.add('ok')});if(t!==q.answer)b.classList.add('bad');fin(t===q.answer?'ok':'no')};ans.appendChild(b)});
    }else if(q.type==='fill'){
      ans.innerHTML=`<input type="text" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="여기에 입력 (¿ ¡ á é í ó ú ñ)"><div class="row" style="margin-top:6px">${['á','é','í','ó','ú','ñ','¿','¡'].map(c=>`<button class="btn sm ghost ch">${c}</button>`).join('')}<button class="btn" id="ck">확인</button></div>`;
      const inp=$('#inp',el);inp.focus();
      ans.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{inp.value+=b.textContent;inp.focus()});
      const go=()=>{if(done_)return;inp.disabled=true;$('#ck',el).disabled=true;fin(chk(inp.value,q.answer))};
      $('#ck',el).onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()};
    }else{
      const draw=()=>{ans.innerHTML=`<div class="built" id="bt">${picked.map(p=>`<button class="tok" data-n="${p.n}">${esc(p.t)}</button>`).join('')}</div><div id="bk">${bank.filter(b=>!b.used).map(b=>`<button class="tok" data-b="${b.n}">${esc(b.t)}</button>`).join('')}</div><div class="row" style="margin-top:8px"><button class="btn" id="ck">확인</button><button class="btn ghost" id="rs">지우기</button></div>`;
        ans.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const it=bank.find(x=>x.n==b.dataset.b);it.used=true;picked.push(it);draw()});
        ans.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const it=picked.find(x=>x.n==b.dataset.n);it.used=false;picked=picked.filter(x=>x!==it);draw()});
        $('#rs',el).onclick=()=>{bank.forEach(b=>b.used=false);picked=[];draw()};
        $('#ck',el).onclick=()=>{if(done_)return;ans.querySelectorAll('button').forEach(b=>b.disabled=true);fin(chk(picked.map(p=>p.t).join(' '),[q.answer]))}};
      draw();
    }
  }
  function done(){
    const pct=Math.round(score/total*100);
    if(o.key){const p=S.scores[o.key];if(!p||score/total>=p.b/p.t){S.scores[o.key]={b:score,t:total}}save()}
    const secHtml=Object.keys(secs).length>1?`<div class="wrapx"><table class="tbl"><tr><th>영역</th><th>점수</th></tr>${Object.entries(secs).map(([k,v])=>`<tr><td>${k}</td><td>${v[0]} / ${v[1]}</td></tr>`).join('')}</table></div>`:'';
    const secs_=Math.round((Date.now()-t0)/1000);
    el.innerHTML=`<div class="card"><h2>${pct>=80?'🎉':pct>=60?'👍':'💪'} ${score} / ${total} (${pct}%)</h2><p>${pct>=80?'훌륭해요! 합격선(80%)을 넘었어요.':'80% 이상을 목표로 한 번 더 도전해 봐요. 틀린 문제는 <b>복습</b> 탭에 저장돼요.'} <small>(소요 ${Math.floor(secs_/60)}분 ${secs_%60}초)</small></p>${secHtml}
    ${miss.length?`<h3>틀린 문제</h3>`+miss.map(q=>`<div class="ex">${q.q}<span>정답: ${esc(Array.isArray(q.answer)?q.answer[0]:q.answer)}${q.exp?' · '+q.exp:''}</span></div>`).join(''):'<p>전부 맞혔어요! 🌟</p>'}
    <div class="row" style="margin-top:10px"><button class="btn" id="rt">🔄 다시 풀기</button>${miss.length?'<button class="btn sec" id="rm">틀린 문제만 다시</button>':''}${o.back?'<button class="btn ghost" id="bk">← 돌아가기</button>':''}</div></div>`;
    $('#rt',el).onclick=()=>quiz(el,qs0,o);
    if(miss.length)$('#rm',el).onclick=()=>quiz(el,miss,{...o,key:null});
    if(o.back)$('#bk',el).onclick=o.back;
  }
  show();
}

function pMock(){
  app.innerHTML=`<h2>🏁 모의시험</h2><p>실제 시험 구성(TEST II·III·IV)을 따라 섞어서 풀어 보는 종합 연습이에요. 영역별 점수도 알려줘요.</p>
  <div class="card"><b>전체 모의시험 (약 40문제)</b><ul><li>TEST II 어휘·문법 22문제</li><li>TEST III 읽기 10문제 (+ 글쓰기는 <a href="#rw/write">연습실</a>에서!)</li><li>TEST IV 듣기 8문제 (말하기는 <a href="#ls/speak">말하기 연습</a>에서!)</li></ul><div class="row"><button class="btn" id="go">시작하기 ${pill('m:full')}</button><button class="btn sec" id="q10">⚡ 빠른 10문제</button></div></div><div id="qz"></div>`;
  const gQs=()=>G.flatMap(g=>g.qs).map(q=>({...q,sec:'TEST II'}));
  const pickR=n=>shuffle(R.flatMap(r=>r.qs)).slice(0,n);
  const pickL=n=>shuffle(Object.values(DLG).flatMap(d=>d.qs)).slice(0,n);
  $('#go').onclick=()=>{const qs=[...vocabQs(ALLW,8),...shuffle(gQs()).slice(0,14),...pickR(10),...pickL(8)];$('.card').style.display='none';quiz($('#qz'),qs,{key:'m:full',noshuffle:true,back:pMock})};
  $('#q10').onclick=()=>{const qs=shuffle([...vocabQs(ALLW,10),...gQs(),...pickR(6),...pickL(4)]).slice(0,10);$('.card').style.display='none';quiz($('#qz'),qs,{noshuffle:true,back:pMock})};
}

/* ---- 복습 ---- */
function pReview(){
  const n=S.wrong.length;
  app.innerHTML=`<h2>🔁 틀린 문제 복습</h2><div class="card"><p>지금까지 틀린 문제가 <b>${n}개</b> 저장되어 있어요. 맞히면 목록에서 사라져요.</p>${n?`<div class="row"><button class="btn" id="go">복습 시작</button><button class="btn ghost" id="cl">목록 비우기</button></div>`:'<p>🌟 틀린 문제가 없어요! 모의시험에 도전해 보세요.</p>'}</div>
  <div id="qz"></div><div class="card"><h3>📚 진도 초기화</h3><button class="btn ghost" id="rs">모든 기록 지우기</button></div>`;
  if(n){$('#go').onclick=()=>{$('.card').style.display='none';quiz($('#qz'),S.wrong.slice(),{review:true,back:pReview})};$('#cl').onclick=()=>{if(confirm('틀린 문제 목록을 비울까요?')){S.wrong=[];save();pReview()}}}
  $('#rs').onclick=()=>{if(confirm('점수·암기·체크 기록을 모두 지울까요?')){S={scores:{},known:{},wrong:[],goals:{},practiced:{},draft:''};save();route()}};
}

/* ================= 라우터 ================= */
const PAGES={home:pHome,guide:pGuide,vocab:pVocab,grammar:pGrammar,rw:pRW,ls:pLS,culture:pCulture,mock:pMock,review:pReview};
function route(){
  const [tab,sub]=(location.hash.slice(1)||'home').split('/');
  stopAudio();clearInterval(window._tm);
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.t===tab));
  (PAGES[tab]||pHome)(sub);window.scrollTo(0,0);
  const on=$('#nav a.on');if(on)on.scrollIntoView({inline:'center',block:'nearest'});
}
window.addEventListener('hashchange',route);route();
</script>
